appId: com.eknuth.sigpocket
name: "Service list - View, sort, and navigate services"
tags:
  - requires-instance
---

# Should be on the services tab
- assertVisible: "Services"

# Wait for skeleton to resolve into real data
- extendedWaitUntil:
    visible: "P99"
    timeout: 15000

# Verify metric labels are present
- assertVisible: "Err%"
- assertVisible: "RPM"
- assertVisible: "Avg"

# Default sort is by status — verify sort bar is visible
- assertVisible:
    id: "sort-status"

# Switch to sort by name
- tapOn:
    id: "sort-name"

# Switch to sort by errors
- tapOn:
    id: "sort-errors"

# Switch to sort by latency
- tapOn:
    id: "sort-latency"

# Switch back to status (default)
- tapOn:
    id: "sort-status"

# Tap a service card to navigate to detail
- tapOn:
    text: "P99"

# Should see the service detail screen
- assertVisible: "Service"
